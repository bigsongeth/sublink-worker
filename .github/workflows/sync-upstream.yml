name: Sync Upstream

on:
  schedule:
    - cron: '0 1 * * 1' # Monday 01:00 UTC (09:00 Beijing)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/7Sageer/sublink-worker.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge upstream/main --no-edit
          git push origin main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger the push-based deploy
      # workflow, so dispatch it explicitly after a successful merge.
      - name: Trigger deploy
        if: steps.merge.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Worker" --repo "$GITHUB_REPOSITORY"
